<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LaTeX Floater</title>

  <!-- Third-party files come from vendor/, which scripts/vendor.js fills from
       node_modules before every dev run and build — Tauri bundles this
       directory as-is, so nothing outside it can be referenced.

       mathquill.css must come BEFORE styles.css: several of our overrides of
       MathQuill's field styling tie with its own rules on specificity (some
       on both sides are !important), and in a tie the later stylesheet wins.
       With the order reversed, MathQuill's border, focus glow and system-blue
       selection colour beat ours — see the .editor__field comment in styles.css.

       IBM Plex gives us a characterful sans + mono pair without going generic.
       Mono is used for the "LaTeX source" readout; sans for everything else.
       The @font-face rules (self-hosted, src/fonts/) live in styles.css —
       see the comment there for why this isn't loaded from Google Fonts. -->
  <link rel="stylesheet" href="vendor/mathquill.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- =================================================================
       Title bar. The drag region spans the top and lets the user move
       the window. Tauri starts a native drag on mousedown of any element
       carrying data-tauri-drag-region — and only that element, not its
       children — so the bar and each piece of the brand carry it, while
       the buttons and slider on the right don't and so still get clicks.
       ================================================================= -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar__brand" data-tauri-drag-region>
      <span class="titlebar__dot" aria-hidden="true" data-tauri-drag-region></span>
      <span class="titlebar__name" data-tauri-drag-region>LaTeX Floater</span>
    </div>
    <div class="titlebar__controls">
      <!-- LaTeX coins (battle pass); gold whatever the theme. -->
      <span class="titlebar__coins" id="coins" title="LaTeX coins — earned from the battle pass. They do nothing. Yet.">
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="currentColor" opacity="0.9"/><text x="8" y="11.2" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono, monospace" font-weight="600" fill="var(--bg-bar)">L</text></svg>
        <span id="coin-count">0</span>
      <button id="btn-theme" class="titlebar__btn" title="Toggle light/dark mode">
        <!-- sun icon (shown in dark mode to switch to light) -->
        <svg id="icon-sun" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
          <circle cx="8" cy="8" r="3"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.42 1.42M11.36 11.36l1.42 1.42M3.22 12.78l1.42-1.42M11.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <!-- moon icon (shown in light mode to switch to dark) -->
        <svg id="icon-moon" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true" style="display:none">
          <path d="M6 2a6 6 0 1 0 8 8 4.5 4.5 0 0 1-8-8z"/>
        </svg>
      </button>
      <!-- Theme picker (battle-pass rewards). -->
      <button id="btn-palette" class="titlebar__btn" title="Themes">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13.5 2.5 6.8 9.2M6.8 9.2c-1 1-1 2.3-2.2 3.2-.9.7-2.3.8-3.1.4 1.2-.6 1.1-1.7 1.6-2.7.6-1.1 1.9-1.4 2.7-.6l1-.3z"/>
          <path d="M13.5 2.5c.5.5.5 1.2 0 1.7l-5.2 5.2-1.5-1.5 5-5.2c.5-.5 1.2-.5 1.7-.2z"/>
        </svg>
      </button>
      </span>
      <input  id="opacity-slider" class="titlebar__opacity" type="range" min="20" max="100" value="100" step="5" title="Window opacity">
      <button id="btn-font-dec" class="titlebar__btn titlebar__btn--font" title="Decrease font size">A−</button>
      <button id="btn-font-inc" class="titlebar__btn titlebar__btn--font" title="Increase font size">A+</button>
      <button id="btn-pin"      class="titlebar__btn titlebar__btn--pin" title="Toggle always-on-top">
        <!-- pin icon -->
        <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
          <path d="M9.828 1.172a1 1 0 0 0-1.414 0L6.586 3H4a1 1 0 0 0-.707 1.707L6 7.414V11l-2.707 2.707A1 1 0 0 0 4 15.414h8a1 1 0 0 0 .707-1.707L10 11V7.414l2.707-2.707A1 1 0 0 0 12 3H9.414L7.586 1.172a1 1 0 0 0-1.414 0z"/>
        </svg>
      </button>
      <button id="btn-minimize" class="titlebar__btn" title="Minimize">
        <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><rect x="2" y="5.5" width="8" height="1"/></svg>
      </button>
      <button id="btn-close"    class="titlebar__btn titlebar__btn--close" title="Close">
        <svg viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- =================================================================
       The math field. MathQuill turns this span into a WYSIWYG-math
       editor that behaves exactly like Symbolab's input.
       ================================================================= -->
  <section class="editor">
    <!-- Committed expressions stack up here, newest nearest the field and
         older ones dimmer, and the whole stack scrolls once it outgrows the
         space. app.js fills #history-list; the wrapper is the scroll box. -->
    <div class="editor__history" id="history">
      <div class="editor__history-list" id="history-list"></div>
    </div>
    <div class="editor__row">
      <span id="mf" class="editor__field"></span>
      <!-- The value of a closed expression (no free x or y), e.g. "= -2"
           for a definite integral. Filled by app.js; hidden otherwise. -->
      <span class="editor__result" id="result" hidden></span>
      <button id="btn-clear" class="editor__clear" title="Clear (Esc)">
        <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <!-- The grapher. Its bar sits under the field at all times; the chevron
         expands and collapses the plot below it (collapsed by default).
         Collapsed, field and bar sit at the bottom of the editor area and
         the history gets everything above; expanded, the plot and the
         history split the space equally so the field ends up centred.
         Everything inside is driven by graph.js. -->
    <div class="graph is-collapsed" id="graph">
      <div class="graph__bar">
        <span class="graph__status" id="graph-status">Graph</span>
        <button id="graph-reset" class="graph__btn" title="Reset view (or double-click the graph)" hidden>
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 8a6 6 0 1 0 1.8-4.3M2 2v3h3"/></svg>
        </button>
        <button id="graph-toggle" class="graph__btn graph__btn--toggle" title="Expand graph">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
        </button>
      </div>
      <div class="graph__canvas-wrap" id="graph-canvas-wrap" hidden>
        <canvas id="graph-canvas"></canvas>
        <div class="graph__tip" id="graph-tip" hidden></div>
      </div>
    </div>
  </section>
  <!-- The theme dropdown, positioned under the paint-brush button by battlepass.js. -->
  <div class="menu" id="theme-menu" hidden></div>

  <!-- =================================================================
       LaTeX source readout — plain text mirror of the math field so the
       user can see exactly what they'll paste. Read-only.
       ================================================================= -->
  <section class="source">
    <span class="source__label">TeX</span>
    <code id="source-out" class="source__code"></code>
  </section>

  <!-- =================================================================
       Action row. Copy LaTeX is primary; PNG is the fallback.
       ================================================================= -->
  <footer class="actions">
    <button id="copy-latex"  class="btn btn--primary">Copy LaTeX</button>
    <button id="copy-png"    class="btn">PNG</button>
    <div class="actions__status" id="status" aria-live="polite"></div>
  </footer>

  <!-- =================================================================
       The battle pass. A gag a friend asked for; see battlepass.js. The
       window's bottom strip: a bar in the same shape as the graph's, with
       the chevron expanding the reward track below it. Collapsed by default.
       ================================================================= -->
  <section class="pass is-collapsed" id="pass">
    <div class="pass__bar">
      <span class="pass__title">Battle Pass</span>
      <span class="pass__level" id="pass-level">Level 1</span>
      <span class="pass__xpbar"><span class="pass__xpfill" id="pass-xpfill"></span></span>
      <span class="pass__xp" id="pass-xp">0 / 90 XP</span>
      <span class="pass__gain" id="pass-gain" hidden></span>
      <button id="pass-toggle" class="graph__btn graph__btn--toggle" title="Expand battle pass">
        <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg>
      </button>
    </div>
    <div class="pass__track-wrap" id="pass-track-wrap" hidden>
      <div class="pass__track" id="pass-track"></div>
    </div>
  </section>

  <script src="vendor/jquery.min.js"></script>
  <script src="vendor/mathquill.min.js"></script>
  <!-- bridge.js defines window.floater; app.js is written against it.
       latex-math.js and graph.js define window.LatexMath and window.Grapher,
       which app.js drives. -->
  <script src="bridge.js"></script>
  <script src="latex-math.js"></script>
  <script src="graph.js"></script>
  <script src="themes.js"></script>
  <script src="battlepass.js"></script>
  <script src="app.js"></script>
</body>
</html>
