<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>capture</title>

  <!-- Never shown to the user — this page only exists to be screenshotted by
       png:render in main.js, so it renders a fixed white/dark-text look
       rather than following the app's live light/dark theme. No Google
       Fonts link here (there never needed to be one): MathQuill's own CSS
       hardcodes math glyphs to "Times New Roman"/Symbola regardless of any
       inherited font-family, so IBM Plex was never actually visible on this
       page — it would only have added a pointless network dependency, the
       same mistake fixed in index.html/styles.css for the same reason. -->
  <link rel="stylesheet" href="../node_modules/mathquill/build/mathquill.css">
  <style>
    html, body { margin: 0; padding: 0; background: #ffffff; }

    /* Deliberately NOT width:100% like the real editor field (styles.css) —
       staying auto-width/shrink-to-fit is what lets #mf's own
       getBoundingClientRect() report the expression's true size in
       capture.js, even when it's bigger than this window's current size. */
    #mf {
      display: inline-block;
      padding: 16px;
      font-size: 32px;
      /* MathQuill adds its mq-editable-field class to #mf itself, so its
         default 1px gray border has to be cancelled on this very rule — an
         earlier "#mf .mq-editable-field" descendant selector never matched
         and every exported PNG carried that border. */
      border: none;
      box-shadow: none;
      margin: 0;
    }
    #mf .mq-root-block, #mf .mq-root-block * { color: #111111 !important; }
  </style>
</head>
<body>
  <span id="mf"></span>

  <script src="../node_modules/jquery/dist/jquery.min.js"></script>
  <script src="../node_modules/mathquill/build/mathquill.min.js"></script>
  <script src="capture.js"></script>
</body>
</html>
